name: Docker CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: GitHub bata tapaiko code tanna
    - name: Checkout Code
      uses: actions/checkout@v3

    # Step 2: Docker environment setup garna
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # Step 3: Docker image build garne (Jaha paila error aauthiyo)
    - name: Build Docker Image
      run: |
        docker build -t my-fastapi-app .
        echo "Docker image successfully built in cloud!"