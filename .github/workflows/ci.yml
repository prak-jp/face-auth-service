name: Docker CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: GitHub bata code tanna
    - name: Checkout Code
      uses: actions/checkout@v3

    # Step 2: Docker environment setup garna
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # Step 3: Docker Hub ma login garna (Tapaile rakheko secrets use garera)
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 4: Docker Image Build garne ra Docker Hub ma Push garne
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/face-auth-service:latest